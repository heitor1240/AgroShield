version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agroshield_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agroshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agroshield_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-agroshield_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
